<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>v-for key demo</title>
    <style>
      :root {
        font-family: "Microsoft YaHei", Arial, sans-serif;
        color: #1f2937;
        background: #eef2f7;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 24px;
      }

      main {
        max-width: 1100px;
        margin: 0 auto;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 26px;
      }

      p {
        margin: 0 0 16px;
        color: #536174;
      }

      .toolbar {
        display: flex;
        gap: 10px;
        margin-bottom: 16px;
      }

      button {
        min-height: 36px;
        border: 1px solid #b9c4ce;
        border-radius: 6px;
        padding: 6px 12px;
        background: #ffffff;
        cursor: pointer;
      }

      .columns {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }

      section {
        border: 1px solid #d6dee8;
        border-radius: 8px;
        padding: 14px;
        background: #ffffff;
      }

      h2 {
        margin: 0 0 12px;
        font-size: 18px;
      }

      .row {
        display: grid;
        grid-template-columns: 120px 1fr;
        gap: 10px;
        align-items: center;
        padding: 8px 0;
        border-bottom: 1px solid #e5eaf0;
      }

      .row:last-child {
        border-bottom: 0;
      }

      input {
        min-height: 34px;
        border: 1px solid #c8d2dc;
        border-radius: 6px;
        padding: 6px 8px;
      }

      code {
        display: inline-block;
        margin-top: 12px;
        padding: 8px 10px;
        border-radius: 6px;
        background: #f4f6f8;
      }

      @media (max-width: 760px) {
        .columns {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="demo-app"></div>

    <script type="module">
      import { createApp, ref } from "vue";

      createApp({
        setup() {
          const rows = ref([
            { id: 1, name: "A 行" },
            { id: 2, name: "B 行" },
            { id: 3, name: "C 行" },
          ]);

          function removeFirst() {
            rows.value = rows.value.slice(1);
          }

          function reverseRows() {
            rows.value = [...rows.value].reverse();
          }

          function resetRows() {
            rows.value = [
              { id: 1, name: "A 行" },
              { id: 2, name: "B 行" },
              { id: 3, name: "C 行" },
            ];
          }

          return {
            rows,
            removeFirst,
            reverseRows,
            resetRows,
          };
        },
        template: `
          <main>
            <h1>v-for 和 key 实验页</h1>
            <p>先在每一行输入框里随便打字，然后点“删除第一行”或“反转顺序”。观察左边和右边输入框内容是否跟着正确的行走。</p>

            <div class="toolbar">
              <button type="button" @click="removeFirst">删除第一行</button>
              <button type="button" @click="reverseRows">反转顺序</button>
              <button type="button" @click="resetRows">重置</button>
            </div>

            <div class="columns">
              <section>
                <h2>不写 key</h2>
                <div v-for="row in rows" class="row">
                  <strong>{{ row.name }}</strong>
                  <input :placeholder="'给 ' + row.name + ' 输入一点内容'" />
                </div>
                <code>v-for="row in rows"</code>
              </section>

              <section>
                <h2>写 key</h2>
                <div v-for="row in rows" :key="row.id" class="row">
                  <strong>{{ row.name }}</strong>
                  <input :placeholder="'给 ' + row.name + ' 输入一点内容'" />
                </div>
                <code>v-for="row in rows" :key="row.id"</code>
              </section>
            </div>
          </main>
        `,
      }).mount("#demo-app");
    </script>
  </body>
</html>
